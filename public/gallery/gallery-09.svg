<svg
  aria-label="Concert placeholder art 9"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="457"
      cy="343"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="477"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="457"
      x2="457"
      y1="0"
      y2="343"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="408"
      x2="358"
      y1="-40"
      y2="343"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="457"
      x2="457"
      y1="-40"
      y2="343"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="507"
      x2="556"
      y1="-40"
      y2="343"
    />
  </g>
  <circle cx="457" cy="343" fill="url(#glow)" r="477" />
  <circle
    cx="457"
    cy="343"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="254" cy="206" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="391" cy="295" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="528" cy="384" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="665" cy="473" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="362" cy="242" fill="#DBB85C" opacity="0.15" r="2.5" />
  <circle cx="499" cy="331" fill="#DBB85C" opacity="0.25" r="3.5" />
  <circle cx="636" cy="420" fill="#DBB85C" opacity="0.35" r="1.5" />
  <circle cx="333" cy="189" fill="#DBB85C" opacity="0.45" r="2.5" />
  <ellipse cx="600" cy="931" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="369" cy="971" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
