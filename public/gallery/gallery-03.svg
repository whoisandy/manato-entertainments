<svg
  aria-label="Concert placeholder art 3"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="779"
      cy="241"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="559"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="779"
      x2="779"
      y1="0"
      y2="241"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="733"
      x2="686"
      y1="-40"
      y2="241"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="779"
      x2="779"
      y1="-40"
      y2="241"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="826"
      x2="872"
      y1="-40"
      y2="241"
    />
  </g>
  <circle cx="779" cy="241" fill="url(#glow)" r="559" />
  <circle
    cx="779"
    cy="241"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="898" cy="322" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="595" cy="91" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="732" cy="180" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="869" cy="269" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="566" cy="358" fill="#DBB85C" opacity="0.15" r="2.5" />
  <circle cx="703" cy="127" fill="#DBB85C" opacity="0.25" r="3.5" />
  <circle cx="840" cy="216" fill="#DBB85C" opacity="0.35" r="1.5" />
  <circle cx="977" cy="305" fill="#DBB85C" opacity="0.45" r="2.5" />
  <ellipse cx="600" cy="937" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="523" cy="977" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
