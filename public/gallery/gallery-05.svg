<svg
  aria-label="Concert placeholder art 5"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="445"
      cy="195"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="465"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="445"
      x2="445"
      y1="0"
      y2="195"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="270"
      x2="95"
      y1="-40"
      y2="195"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="358"
      x2="270"
      y1="-40"
      y2="195"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="445"
      x2="445"
      y1="-40"
      y2="195"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="533"
      x2="620"
      y1="-40"
      y2="195"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="620"
      x2="795"
      y1="-40"
      y2="195"
    />
  </g>
  <circle cx="445" cy="195" fill="url(#glow)" r="465" />
  <circle
    cx="445"
    cy="195"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="230" cy="230" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="367" cy="319" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="504" cy="88" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="641" cy="177" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="338" cy="266" fill="#DBB85C" opacity="0.15" r="2.5" />
  <circle cx="475" cy="35" fill="#DBB85C" opacity="0.25" r="3.5" />
  <circle cx="612" cy="124" fill="#DBB85C" opacity="0.35" r="1.5" />
  <circle cx="309" cy="213" fill="#DBB85C" opacity="0.45" r="2.5" />
  <ellipse cx="600" cy="905" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="645" cy="945" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
