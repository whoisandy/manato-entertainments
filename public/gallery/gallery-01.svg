<svg
  aria-label="Concert placeholder art 1"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="433"
      cy="287"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="453"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="433"
      x2="433"
      y1="0"
      y2="287"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="335"
      x2="237"
      y1="-40"
      y2="287"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="400"
      x2="368"
      y1="-40"
      y2="287"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="466"
      x2="499"
      y1="-40"
      y2="287"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="531"
      x2="630"
      y1="-40"
      y2="287"
    />
  </g>
  <circle cx="433" cy="287" fill="url(#glow)" r="453" />
  <circle
    cx="433"
    cy="287"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="646" cy="414" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="343" cy="183" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="480" cy="272" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="617" cy="361" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="314" cy="130" fill="#DBB85C" opacity="0.15" r="2.5" />
  <circle cx="451" cy="219" fill="#DBB85C" opacity="0.25" r="3.5" />
  <circle cx="588" cy="308" fill="#DBB85C" opacity="0.35" r="1.5" />
  <circle cx="285" cy="397" fill="#DBB85C" opacity="0.45" r="2.5" />
  <ellipse cx="600" cy="879" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="401" cy="919" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
