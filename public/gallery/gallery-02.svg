<svg
  aria-label="Concert placeholder art 2"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="606"
      cy="384"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="506"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="606"
      x2="606"
      y1="0"
      y2="384"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="434"
      x2="262"
      y1="-40"
      y2="384"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="520"
      x2="434"
      y1="-40"
      y2="384"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="606"
      x2="606"
      y1="-40"
      y2="384"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="692"
      x2="778"
      y1="-40"
      y2="384"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="778"
      x2="950"
      y1="-40"
      y2="384"
    />
  </g>
  <circle cx="606" cy="384" fill="url(#glow)" r="506" />
  <circle
    cx="606"
    cy="384"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="552" cy="288" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="689" cy="377" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="386" cy="466" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="523" cy="235" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="660" cy="324" fill="#DBB85C" opacity="0.15" r="2.5" />
  <ellipse cx="600" cy="908" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="462" cy="948" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
