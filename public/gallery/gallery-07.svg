<svg
  aria-label="Concert placeholder art 7"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="791"
      cy="389"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="571"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="791"
      x2="791"
      y1="0"
      y2="389"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="688"
      x2="586"
      y1="-40"
      y2="389"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="757"
      x2="723"
      y1="-40"
      y2="389"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="825"
      x2="860"
      y1="-40"
      y2="389"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="894"
      x2="997"
      y1="-40"
      y2="389"
    />
  </g>
  <circle cx="791" cy="389" fill="url(#glow)" r="571" />
  <circle
    cx="791"
    cy="389"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="922" cy="298" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="619" cy="387" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="756" cy="476" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="893" cy="245" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="590" cy="334" fill="#DBB85C" opacity="0.15" r="2.5" />
  <circle cx="727" cy="423" fill="#DBB85C" opacity="0.25" r="3.5" />
  <circle cx="864" cy="512" fill="#DBB85C" opacity="0.35" r="1.5" />
  <circle cx="1001" cy="281" fill="#DBB85C" opacity="0.45" r="2.5" />
  <ellipse cx="600" cy="873" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="767" cy="913" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
