<svg
  aria-label="Concert placeholder art 10"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="630"
      cy="200"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="530"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="630"
      x2="630"
      y1="0"
      y2="200"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="525"
      x2="420"
      y1="-40"
      y2="200"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="595"
      x2="560"
      y1="-40"
      y2="200"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="665"
      x2="700"
      y1="-40"
      y2="200"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="735"
      x2="840"
      y1="-40"
      y2="200"
    />
  </g>
  <circle cx="630" cy="200" fill="url(#glow)" r="530" />
  <circle
    cx="630"
    cy="200"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="600" cy="240" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="737" cy="329" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="434" cy="98" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="571" cy="187" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="708" cy="276" fill="#DBB85C" opacity="0.15" r="2.5" />
  <ellipse cx="600" cy="870" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="430" cy="910" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
