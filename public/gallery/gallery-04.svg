<svg
  aria-label="Concert placeholder art 4"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="272"
      cy="338"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="412"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="272"
      x2="272"
      y1="0"
      y2="338"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="172"
      x2="71"
      y1="-40"
      y2="338"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="239"
      x2="205"
      y1="-40"
      y2="338"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="306"
      x2="339"
      y1="-40"
      y2="338"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="373"
      x2="473"
      y1="-40"
      y2="338"
    />
  </g>
  <circle cx="272" cy="338" fill="url(#glow)" r="412" />
  <circle
    cx="272"
    cy="338"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="324" cy="196" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="461" cy="285" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="158" cy="374" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="295" cy="463" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="432" cy="232" fill="#DBB85C" opacity="0.15" r="2.5" />
  <ellipse cx="600" cy="876" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="584" cy="916" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
