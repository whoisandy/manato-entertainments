<svg
  aria-label="Concert placeholder art 8"
  height="800"
  role="img"
  viewBox="0 0 1200 800"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient
      cx="284"
      cy="246"
      gradientUnits="userSpaceOnUse"
      id="glow"
      r="424"
    >
      <stop offset="0%" stop-color="#C79B32" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#C79B32" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="beam"
      x1="284"
      x2="284"
      y1="0"
      y2="246"
    >
      <stop offset="0%" stop-color="#EAD28A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C79B32" stop-opacity="0" />
    </linearGradient>
    <filter height="180%" id="soft" width="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
        type="fractalNoise"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA slope="0.06" type="linear" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect fill="#050505" height="800" width="1200" />
  <g filter="url(#soft)" opacity="0.55">
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="106"
      x2="-72"
      y1="-40"
      y2="246"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="195"
      x2="106"
      y1="-40"
      y2="246"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="284"
      x2="284"
      y1="-40"
      y2="246"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="373"
      x2="462"
      y1="-40"
      y2="246"
    />
    <line
      stroke="url(#beam)"
      stroke-width="3"
      x1="462"
      x2="640"
      y1="-40"
      y2="246"
    />
  </g>
  <circle cx="284" cy="246" fill="url(#glow)" r="424" />
  <circle
    cx="284"
    cy="246"
    fill="#EAD28A"
    filter="url(#soft)"
    opacity="0.35"
    r="64"
  />
  <circle cx="348" cy="332" fill="#DBB85C" opacity="0.15" r="1.5" />
  <circle cx="485" cy="101" fill="#DBB85C" opacity="0.25" r="2.5" />
  <circle cx="182" cy="190" fill="#DBB85C" opacity="0.35" r="3.5" />
  <circle cx="319" cy="279" fill="#DBB85C" opacity="0.45" r="1.5" />
  <circle cx="456" cy="368" fill="#DBB85C" opacity="0.15" r="2.5" />
  <ellipse cx="600" cy="902" fill="#030303" rx="1050" ry="180" />
  <ellipse cx="828" cy="942" fill="#020202" rx="760" ry="150" />
  <rect filter="url(#grain)" height="800" width="1200" />
</svg>
